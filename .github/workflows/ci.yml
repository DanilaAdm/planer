name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: PlannerCore unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app
      - name: Run PlannerCore tests
        run: swift test --package-path Packages/PlannerCore

  app-build-test:
    name: App build & tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build & test (macOS)
        run: |
          set -o pipefail
          xcodebuild test \
            -project PlannerApp.xcodeproj \
            -scheme PlannerApp \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build iOS (no signing)
        run: |
          xcodebuild build \
            -project PlannerApp.xcodeproj \
            -scheme PlannerApp \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
