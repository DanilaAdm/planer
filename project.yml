name: PlannerApp
options:
  bundleIdPrefix: com.planner
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

packages:
  PlannerCore:
    path: Packages/PlannerCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  PlannerApp:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planner.repetitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Имя бандла оставляем латиницей (PlannerApp), иначе ломается TEST_HOST у тестовых таргетов.
        # Пользователю приложение всё равно показывается как «Планер» через CFBundleDisplayName.
        INFOPLIST_KEY_CFBundleDisplayName: "Планер"
        INFOPLIST_KEY_CFBundleName: "Планер"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: PlannerCore
        product: PlannerCore
      - package: Supabase
        product: Supabase

  PlannerAppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Tests
    dependencies:
      - target: PlannerApp
      - package: PlannerCore
        product: PlannerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planner.repetitor.tests
        GENERATE_INFOPLIST_FILE: YES
        # Кроссплатформенный путь к исполняемому файлу хоста: на iOS папка пустая,
        # на macOS — Contents/MacOS. Без этого тесты не запускаются под macOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PlannerApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PlannerApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PlannerAppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/UITests
    dependencies:
      - target: PlannerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planner.repetitor.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PlannerApp:
    build:
      targets:
        PlannerApp: all
    test:
      targets:
        - PlannerAppTests
        - PlannerAppUITests
      gatherCoverageData: true
